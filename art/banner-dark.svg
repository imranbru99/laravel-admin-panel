<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Orbs -->
    <radialGradient id="orb1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orb2" cx="80%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orb3" cx="50%" cy="90%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Glass Surface -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Primary Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Sparkline Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Background Layer -->
  <rect width="1280" height="640" fill="url(#bgGrad)" />

  <!-- Ambient Glow Orbs -->
  <rect width="1280" height="640" fill="url(#orb1)" />
  <rect width="1280" height="640" fill="url(#orb2)" />
  <rect width="1280" height="640" fill="url(#orb3)" />

  <!-- Grid Overlay lines for tech aesthetics -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80" />
    <line x1="0" y1="160" x2="1280" y2="160" />
    <line x1="0" y1="240" x2="1280" y2="240" />
    <line x1="0" y1="320" x2="1280" y2="320" />
    <line x1="0" y1="400" x2="1280" y2="400" />
    <line x1="0" y1="480" x2="1280" y2="480" />
    <line x1="0" y1="560" x2="1280" y2="560" />
    <line x1="160" y1="0" x2="160" y2="640" />
    <line x1="320" y1="0" x2="320" y2="640" />
    <line x1="480" y1="0" x2="480" y2="640" />
    <line x1="640" y1="0" x2="640" y2="640" />
    <line x1="800" y1="0" x2="800" y2="640" />
    <line x1="960" y1="0" x2="960" y2="640" />
    <line x1="1120" y1="0" x2="1120" y2="640" />
  </g>

  <!-- Brand Pill Badge Top -->
  <g transform="translate(100, 75)">
    <rect width="270" height="38" rx="19" fill="#1e1e2d" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="20" cy="19" r="6" fill="#10b981" />
    <text x="36" y="24" fill="#e2e8f0" font-size="13" font-weight="600" class="font-sans" letter-spacing="0.5">
      NEXT-GEN LARAVEL 11-13
    </text>
    <rect x="200" y="8" width="60" height="22" rx="11" fill="#6366f1" />
    <text x="215" y="23" fill="#ffffff" font-size="11" font-weight="700" class="font-sans">
      2027
    </text>
  </g>

  <!-- Hero Header Typography -->
  <g transform="translate(100, 160)">
    <text x="0" y="30" fill="url(#primaryGrad)" font-size="44" font-weight="900" class="font-sans" letter-spacing="-1">
      LARAVEL ADMIN PANEL
    </text>
    <text x="0" y="75" fill="#f8fafc" font-size="30" font-weight="700" class="font-sans" letter-spacing="-0.5">
      The All-in-One, AI-Powered Application Framework
    </text>
    <text x="0" y="115" fill="#94a3b8" font-size="17" font-weight="400" class="font-sans">
      Zero Companion Dependencies • Zero Node/Build Step • Anti-Flash Theming • Native Biometric Passkeys
    </text>
  </g>

  <!-- Feature Pills -->
  <g transform="translate(100, 310)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="160" height="36" rx="18" fill="#131b2e" stroke="#2a3854" stroke-width="1" />
    <text x="20" y="23" fill="#93c5fd" font-size="13" font-weight="600" class="font-sans">⚡ Sub-50ms SSR</text>

    <!-- Pill 2 -->
    <rect x="175" y="0" width="165" height="36" rx="18" fill="#131b2e" stroke="#2a3854" stroke-width="1" />
    <text x="195" y="23" fill="#a7f3d0" font-size="13" font-weight="600" class="font-sans">🤖 Agentic AI Hub</text>

    <!-- Pill 3 -->
    <rect x="355" y="0" width="170" height="36" rx="18" fill="#131b2e" stroke="#2a3854" stroke-width="1" />
    <text x="375" y="23" fill="#fbcfe8" font-size="13" font-weight="600" class="font-sans">🎨 8 Color Palettes</text>

    <!-- Pill 4 -->
    <rect x="540" y="0" width="160" height="36" rx="18" fill="#131b2e" stroke="#2a3854" stroke-width="1" />
    <text x="560" y="23" fill="#fed7aa" font-size="13" font-weight="600" class="font-sans">🔐 WebAuthn Passkeys</text>
  </g>

  <!-- 3D Slanted / Modern Glass Preview Mockup -->
  <g transform="translate(730, 90)">
    <!-- Card Outer Frame -->
    <rect width="470" height="490" rx="16" fill="#0d131f" stroke="#222f47" stroke-width="1.5" filter="drop-shadow(0 25px 50px rgba(0,0,0,0.6))" />
    
    <!-- Window Bar -->
    <path d="M 0 16 Q 0 0 16 0 L 454 0 Q 470 0 470 16 L 470 44 L 0 44 Z" fill="#131a29" />
    <circle cx="24" cy="22" r="5.5" fill="#ef4444" />
    <circle cx="42" cy="22" r="5.5" fill="#f59e0b" />
    <circle cx="60" cy="22" r="5.5" fill="#10b981" />
    <rect x="150" y="11" width="170" height="22" rx="11" fill="#1b253b" />
    <text x="180" y="26" fill="#64748b" font-size="11" font-weight="500" class="font-sans">admin.test/admin</text>

    <!-- Mini Mockup Content -->
    <!-- Metric 1: Revenue -->
    <g transform="translate(24, 65)">
      <rect width="200" height="110" rx="12" fill="#141c2c" stroke="#222f46" stroke-width="1" />
      <text x="16" y="30" fill="#94a3b8" font-size="12" font-weight="500" class="font-sans">Total Revenue</text>
      <text x="16" y="64" fill="#ffffff" font-size="22" font-weight="700" class="font-sans">$48,250.00</text>
      <rect x="135" y="15" width="50" height="20" rx="10" fill="rgba(16,185,129,0.2)" />
      <text x="144" y="29" fill="#10b981" font-size="11" font-weight="600" class="font-sans">+14%</text>
      <!-- Sparkline -->
      <path d="M 16 95 L 45 88 L 75 92 L 105 78 L 135 84 L 165 70 L 184 66" fill="none" stroke="#6366f1" stroke-width="2" />
    </g>

    <!-- Metric 2: Active Users -->
    <g transform="translate(244, 65)">
      <rect width="200" height="110" rx="12" fill="#141c2c" stroke="#222f46" stroke-width="1" />
      <text x="16" y="30" fill="#94a3b8" font-size="12" font-weight="500" class="font-sans">Active Users</text>
      <text x="16" y="64" fill="#ffffff" font-size="22" font-weight="700" class="font-sans">2,845</text>
      <rect x="135" y="15" width="50" height="20" rx="10" fill="rgba(59,130,246,0.2)" />
      <text x="145" y="29" fill="#60a5fa" font-size="11" font-weight="600" class="font-sans">+8%</text>
      <!-- Sparkline -->
      <path d="M 16 90 L 50 82 L 85 86 L 120 74 L 155 77 L 184 68" fill="none" stroke="#3b82f6" stroke-width="2" />
    </g>

    <!-- Mini Table / List Row -->
    <g transform="translate(24, 195)">
      <rect width="420" height="160" rx="12" fill="#141c2c" stroke="#222f46" stroke-width="1" />
      
      <!-- Table Header -->
      <text x="20" y="32" fill="#94a3b8" font-size="12" font-weight="600" class="font-sans">PRODUCT</text>
      <text x="200" y="32" fill="#94a3b8" font-size="12" font-weight="600" class="font-sans">CATEGORY</text>
      <text x="320" y="32" fill="#94a3b8" font-size="12" font-weight="600" class="font-sans">STATUS</text>
      <line x1="20" y1="45" x2="400" y2="45" stroke="#222f46" stroke-width="1" />

      <!-- Row 1 -->
      <text x="20" y="78" fill="#f1f5f9" font-size="13" font-weight="600" class="font-sans">Cloud Enterprise SaaS</text>
      <text x="200" y="78" fill="#94a3b8" font-size="13" class="font-sans">Software</text>
      <rect x="320" y="64" width="60" height="20" rx="10" fill="rgba(16,185,129,0.2)" />
      <text x="333" y="78" fill="#10b981" font-size="11" font-weight="600" class="font-sans">Active</text>

      <!-- Row 2 -->
      <text x="20" y="125" fill="#f1f5f9" font-size="13" font-weight="600" class="font-sans">Autonomous AI Hub</text>
      <text x="200" y="125" fill="#94a3b8" font-size="13" class="font-sans">Machine Learning</text>
      <rect x="320" y="111" width="60" height="20" rx="10" fill="rgba(99,102,241,0.2)" />
      <text x="330" y="125" fill="#818cf8" font-size="11" font-weight="600" class="font-sans">Deploy</text>
    </g>

    <!-- Command Palette Bottom Banner -->
    <g transform="translate(24, 375)">
      <rect width="420" height="90" rx="12" fill="#101726" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1" />
      <text x="20" y="32" fill="#c7d2fe" font-size="13" font-weight="600" class="font-sans">⌘K Command Palette Active</text>
      <text x="20" y="58" fill="#94a3b8" font-size="12" class="font-sans">"show orders over $500 this month"</text>
      <rect x="330" y="24" width="70" height="24" rx="6" fill="#6366f1" />
      <text x="345" y="40" fill="#ffffff" font-size="11" font-weight="700" class="font-sans">FILTER</text>
    </g>
  </g>

  <!-- Terminal Installation Bar Bottom Left -->
  <g transform="translate(100, 480)">
    <rect width="580" height="70" rx="14" fill="#0d1422" stroke="#223049" stroke-width="1" />
    <circle cx="26" cy="35" r="5" fill="#10b981" />
    <text x="46" y="41" fill="#e2e8f0" font-size="15" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="600">
      composer require imrandevbd/laravel-admin-panel
    </text>
    <rect x="490" y="18" width="70" height="34" rx="8" fill="#1f2c44" />
    <text x="507" y="40" fill="#93c5fd" font-size="12" font-weight="700" class="font-sans">COPY</text>
  </g>
</svg>
